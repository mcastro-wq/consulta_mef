<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Seguimiento de Inversiones - SSI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #801616;
            --nav-accent: #ffc107;
            --bg-body: #f4f6f9;
            --bg-card: #ffffff;
            --text-main: #222;
            --text-muted: #555;
            --border-color: #dee2e6;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
            --row-hover: #fff0f0;
        }

        body.dark-mode {
            --bg-body: #0f1113;
            --bg-card: #1a1d21;
            --text-main: #f1f1f1;
            --text-muted: #adb5bd;
            --border-color: #2d3238;
            --shadow: 0 10px 30px rgba(0,0,0,0.4);
            --row-hover: #2d1a1a;
        }

        body { 
            background-color: var(--bg-body); 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .header-mef { 
            background-color: var(--primary-color); 
            color: white; 
            padding: 20px 0; 
            border-bottom: 5px solid var(--nav-accent); 
        }

        .table-container { 
            background: var(--bg-card); 
            border-radius: 12px; 
            box-shadow: var(--shadow); 
            padding: 20px; 
            border: 1px solid var(--border-color);
        }

        .table td, .table th {
            background-color: var(--bg-card) !important;
            color: var(--text-main) !important;
            border-color: var(--border-color) !important;
        }

        .table thead th {
            background-color: var(--nav-accent) !important;
            color: #000 !important;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            user-select: none;
        }

        .table thead th:hover { background-color: #f1b400 !important; }

        .filter-box {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }

        .form-control-mef {
            border: 2px solid var(--border-color);
            border-radius: 8px;
        }

        .form-control-mef:focus {
            border-color: var(--primary-color);
            box-shadow: none;
        }

        .progress { 
            height: 18px; 
            border-radius: 10px; 
            background-color: var(--border-color); 
            position: relative; 
            overflow: hidden; 
        }

        .progress-bar-text { 
            position: absolute; 
            width: 100%; 
            text-align: center; 
            font-size: 0.65rem; 
            font-weight: 800; 
            color: #000; 
            z-index: 5; 
            line-height: 18px; 
        }

        .bar-fill { height: 100%; transition: width 0.8s ease; }

        .monto { font-family: 'SFMono-Regular', Consolas, monospace; font-weight: 600; }

        .btn-theme {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 50%;
            width: 35px; height: 35px;
            display: flex; align-items: center; justify-content: center;
        }

        .btn-mef-primary { background-color: var(--primary-color); color: white; border: none; font-weight: bold; }
        .btn-mef-primary:hover { background-color: #a01d1d; color: white; }

        .status-pill {
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        #loading { display: none; margin-left: 10px; }
    </style>
</head>
<body>

<div class="header-mef mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-0"><i class="bi bi-search-selection"></i> SSI - SEGUIMIENTO DE INVERSIONES</h4>
            <span class="badge bg-light text-dark border fw-normal mt-1">
                <i class="bi bi-cpu text-danger"></i> Scraper Conectado
            </span>
        </div>
        <button onclick="toggleDarkMode()" class="btn-theme" id="theme-toggle">
            <i class="bi bi-moon-stars"></i>
        </button>
    </div>
</div>

<div class="container">
    <div class="filter-box">
        <h6 class="fw-bold border-bottom pb-2 mb-3"><i class="bi bi-search"></i> Consultar CUI Real</h6>
        <div class="row g-3">
            <div class="col-md-8">
                <input type="text" id="inputCUI" class="form-control form-control-mef" placeholder="Ingrese Código Único de Inversión (Ej: 2199528)">
            </div>
            <div class="col-md-4">
                <button class="btn btn-mef-primary w-100" onclick="buscarCUI()">
                    <i class="bi bi-terminal"></i> EJECUTAR SCRAPER
                    <span id="loading" class="spinner-border spinner-border-sm" role="status"></span>
                </button>
            </div>
        </div>
    </div>

    <div class="table-container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0 fw-bold text-uppercase" style="color: var(--primary-color)">Resultado de la Inversión</h5>
            <button onclick="exportToExcel()" class="btn btn-sm btn-outline-success">
                <i class="bi bi-file-earmark-excel"></i> Exportar Excel
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle" id="tablaInversiones">
                <thead>
                    <tr>
                        <th class="text-center">CUI</th>
                        <th>Nombre de la Inversión</th>
                        <th class="text-center">PIM (S/)</th>
                        <th class="text-center">Devengado</th>
                        <th class="text-center">Avance %</th>
                        <th class="text-center">Estado</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla">
                    <tr>
                        <td colspan="6" class="text-center text-muted py-4">Ingrese un CUI y presione ejecutar para obtener data real del MEF</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
    let datosInversion = [];

    async function buscarCUI() {
        const cui = document.getElementById('inputCUI').value.trim();
        const loading = document.getElementById('loading');
        const tbody = document.getElementById('cuerpo-tabla');

        if (!cui) {
            alert("Por favor ingrese un CUI");
            return;
        }

        // Mostrar cargando
        loading.style.display = 'inline-block';
        
        try {
            // Llamada a tu API de Flask
            const response = await fetch(`http://localhost:5000/api/buscar/${cui}`);
            const data = await response.json();

            if (data.error) {
                alert("Error: " + data.error);
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger">No se encontró información para el CUI ${cui}</td></tr>`;
            } else {
                datosInversion = [data]; // Guardamos el resultado en el array
                renderizarTabla();
            }
        } catch (error) {
            console.error("Error conectando al scraper:", error);
            alert("No se pudo conectar con el servidor Python. Asegúrate de que app.py esté corriendo.");
        } finally {
            loading.style.display = 'none';
        }
    }

    function renderizarTabla() {
        const tbody = document.getElementById('cuerpo-tabla');
        tbody.innerHTML = '';

        datosInversion.forEach(item => {
            // Cálculo de avance seguro (evitar división por cero)
            const avance = item.pim > 0 ? (item.devengado / item.pim) * 100 : 0;
            const colorBarra = avance > 80 ? '#198754' : (avance > 40 ? '#ffc107' : '#dc3545');
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="text-center fw-bold text-primary">${item.cui}</td>
                <td class="small fw-bold">${item.nombre}</td>
                <td class="text-end monto">${item.pim.toLocaleString('es-PE')}</td>
                <td class="text-end monto">${item.devengado.toLocaleString('es-PE')}</td>
                <td style="width: 150px">
                    <div class="progress">
                        <div class="progress-bar-text">${avance.toFixed(1)}%</div>
                        <div class="bar-fill" style="width: ${avance}%; background-color: ${colorBarra}"></div>
                    </div>
                </td>
                <td class="text-center">
                    <span class="status-pill bg-opacity-10 ${getEstadoColor(item.estado)}">
                        ${item.estado}
                    </span>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    function getEstadoColor(estado) {
        if (!estado) return 'bg-dark text-dark';
        const est = estado.toUpperCase();
        if (est.includes('ACTIVO')) return 'bg-success text-success';
        if (est.includes('CERRADO')) return 'bg-secondary text-secondary';
        if (est.includes('DESACTIVADO')) return 'bg-danger text-danger';
        return 'bg-info text-info';
    }

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        const icon = document.querySelector('#theme-toggle i');
        icon.className = document.body.classList.contains('dark-mode') ? 'bi bi-sun' : 'bi bi-moon-stars';
    }

    function exportToExcel() {
        if (datosInversion.length === 0) return alert("No hay datos para exportar");
        const table = document.getElementById("tablaInversiones");
        const wb = XLSX.utils.table_to_book(table, { sheet: "Data_MEF" });
        XLSX.writeFile(wb, `Inversion_${datosInversion[0].cui}.xlsx`);
    }
</script>

</body>
</html>
