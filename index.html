<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Lambayeque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
   <style>
    :root {
        --primary-color: #801616;
        --bg-light: #f8f9fa;
        /* Variables para el modo claro */
        --bg-body: #f8f9fa;
        --bg-card: #ffffff;
        --text-main: #222222;
        --text-muted: #6c757d;
        --border-color: #dee2e6;
        --shadow: 0 2px 10px rgba(0,0,0,0.03);
    }

    /* Variables para el modo oscuro */
    body.dark-mode {
        --bg-body: #121212;
        --bg-card: #1e1e1e;
        --text-main: #e0e0e0;
        --text-muted: #a0a0a0;
        --border-color: #333333;
        --shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    body { 
        background-color: var(--bg-body); 
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text-main);
        transition: background-color 0.3s, color 0.3s; /* Suaviza el cambio */
    }

    .navbar { background-color: var(--primary-color) !important; border-bottom: 3px solid #ffc107; }
    
    .kpi-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: var(--shadow);
        transition: transform 0.2s, background-color 0.3s;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    
    .kpi-label { 
        font-size: 0.75rem; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
        color: var(--text-muted); 
        font-weight: 700; 
        margin-bottom: 10px;
    }
    
    .kpi-value { 
        font-size: 1.6rem; 
        font-weight: 800; 
        margin: 0; 
        color: var(--text-main); 
        line-height: 1.2;
    }

    /* Forzamos el color verde en el ejecutado para que resalte en ambos modos */
    #total-ejecutado { color: #28a745 !important; }
    
    .progress-container { 
        height: 8px; 
        background: var(--border-color); 
        border-radius: 10px; 
        overflow: hidden; 
        margin-top: 15px; 
    }
    .progress-bar-fill { 
        height: 100%; 
        background: var(--primary-color); 
        width: 0%; 
        transition: width 1s ease-in-out; 
    }
    
    .btn-minimal {
        border: 1px solid rgba(255,255,255,0.3);
        color: white;
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 0.85rem;
        transition: all 0.3s;
    }
    .btn-minimal:hover { background: white; color: var(--primary-color); }

    /* Ajuste para los textos pequeños */
    .text-muted { color: var(--text-muted) !important; }
</style>
</head>
<body>

<nav class="navbar navbar-dark py-3 mb-5">
    <div class="container">
        <div class="d-flex align-items-center w-100">
            <div class="d-flex flex-column align-items-start">
                <h4 class="fw-bold mb-0 text-white">ANALÍTICA LAMBAYEQUE</h4>
                <span class="badge bg-light text-dark border fw-normal mt-1">
                    <i class="bi bi-database-check text-primary"></i> MEF: <span id="fecha-actualizacion">...</span>
                </span>
            </div>
            <div class="ms-auto">
                <a href="consulta2.html" class="btn-minimal">Ranking</a>
            </div>
        </div>
    </div>

    <button onclick="toggleDarkMode()" class="btn-minimal">
    🌙 Modo Oscuro / Claro
    </button>

    
</nav>

<div class="container">
    <div class="mb-4">
        <h2 class="fw-bold mb-0">Resumen de Inversión 2026</h2>
        <p class="text-muted small">Consolidado Gobierno Regional de Lambayeque</p>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="kpi-card">
                <div>
                    <div class="kpi-label">Presupuesto (PIM)</div>
                    <div id="total-pim" class="kpi-value">S/ 0</div>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="kpi-card">
                <div>
                    <div class="kpi-label">Ejecutado (Devengado)</div>
                    <div id="total-ejecutado" class="kpi-value text-success">S/ 0</div>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="kpi-card">
                <div>
                    <div class="kpi-label">Avance Regional</div>
                    <div id="avance-global" class="kpi-value" style="color: var(--primary-color);">0%</div>
                </div>
                <div class="progress-container">
                    <div id="progreso-barra" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
<script>
    const body = document.body;

    // 1. Verificar si ya existía una preferencia guardada
    if (localStorage.getItem('theme') === 'dark') {
        body.classList.add('dark-mode');
    }

    function toggleDarkMode() {
        body.classList.toggle('dark-mode');
        
        // 2. Guardar la elección
        if (body.classList.contains('dark-mode')) {
            localStorage.setItem('theme', 'dark');
        } else {
            localStorage.setItem('theme', 'light');
        }
    }
</script>

    
</body>
</html>
