<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Lambayeque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
        /* Paleta Luz */
        --bg-body: #f8f9fa;
        --bg-card: #ffffff;
        --text-main: #212529;
        --text-muted: #6c757d;
        --border-color: #dee2e6;
        --primary-color: #801616;
        --nav-accent: #ffc107;
        --shadow: 0 2px 10px rgba(0,0,0,0.03);
    }

    body.dark-mode {
        /* Paleta Oscura */
        --bg-body: #0f1113;
        --bg-card: #1a1d21;
        --text-main: #f1f1f1;
        --text-muted: #adb5bd;
        --border-color: #2d3238;
        --shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    body { 
        background-color: var(--bg-body); 
        color: var(--text-main);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Navbar fija los colores para que no cambien demasiado */
    .navbar { 
        background-color: var(--primary-color) !important; 
        border-bottom: 3px solid var(--nav-accent); 
    }

    .kpi-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: var(--shadow);
        transition: transform 0.2s, background-color 0.3s;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .kpi-label { 
        font-size: 0.75rem; 
        text-transform: uppercase; 
        color: var(--text-muted); 
        font-weight: 700; 
    }

    .kpi-value { 
        font-size: 1.6rem; 
        font-weight: 800; 
        color: var(--text-main); 
    }

    /* Forzamos colores de éxito */
    .text-success { color: #2ecc71 !important; }
    .text-muted { color: var(--text-muted) !important; }

    .progress-container { 
        height: 8px; 
        background: var(--border-color); 
        border-radius: 10px; 
        margin-top: 15px; 
    }
    
    .progress-bar-fill { 
        height: 100%; 
        background: var(--primary-color); 
        transition: width 1s ease-in-out; 
    }

    /* Estilo para el botón de cambio */
    .btn-theme {
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
        color: white;
        border-radius: 50%;
        width: 35px;
        height: 35px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.3s;
    }
    .btn-theme:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>

<nav class="navbar navbar-dark py-3 mb-5">
    <div class="container">
        <div class="d-flex align-items-center w-100">
            <div class="d-flex flex-column align-items-start">
                <h4 class="fw-bold mb-0 text-white">ANALÍTICA LAMBAYEQUE</h4>
                <span class="badge bg-light text-dark border fw-normal mt-1">
                    <i class="bi bi-database-check text-primary"></i> MEF: <span id="fecha-actualizacion">...</span>
                </span>
            </div>

            <div class="ms-auto d-flex align-items-center gap-3">
    <a href="consulta2.html" class="btn-minimal">Ranking</a>
    <button onclick="toggleDarkMode()" class="btn-theme" id="theme-toggle">
        <i class="bi bi-moon-stars"></i>
    </button>
</div>

            
        </div>
    </div>
</nav>

<div class="container">
    <div class="mb-4">
        <h2 class="fw-bold mb-0">Resumen de Inversión 2026</h2>
        <p class="text-muted small">Consolidado Gobierno Regional de Lambayeque</p>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="kpi-card">
                <div>
                    <div class="kpi-label">Presupuesto (PIM)</div>
                    <div id="total-pim" class="kpi-value">S/ 0</div>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="kpi-card">
                <div>
                    <div class="kpi-label">Ejecutado (Devengado)</div>
                    <div id="total-ejecutado" class="kpi-value text-success">S/ 0</div>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="kpi-card">
                <div>
                    <div class="kpi-label">Avance Regional</div>
                    <div id="avance-global" class="kpi-value" style="color: var(--primary-color);">0%</div>
                </div>
                <div class="progress-container">
                    <div id="progreso-barra" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>

<script>
    const body = document.body;
    const btn = document.getElementById('theme-toggle');

    // Verificar preferencia guardada
    if (localStorage.getItem('theme') === 'dark') {
        body.classList.add('dark-mode');
        actualizarIcono(true);
    }

    function toggleDarkMode() {
        const isDark = body.classList.toggle('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        actualizarIcono(isDark);
    }

    function actualizarIcono(isDark) {
        const icon = btn.querySelector('i');
        if (isDark) {
            icon.classList.replace('bi-moon-stars', 'bi-sun');
        } else {
            icon.classList.replace('bi-sun', 'bi-moon-stars');
        }
    }
</script>

    
</body>
</html>
