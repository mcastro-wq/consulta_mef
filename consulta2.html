<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Ranking Regional - MEF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #801616;
            --nav-accent: #ffc107;
            --bg-body: #f4f6f9;
            --bg-card: #ffffff;
            --text-main: #222;
            --text-muted: #555;
            --border-color: #dee2e6;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
            --row-hover: #fff0f0;
        }

        /* Variables Modo Oscuro */
        body.dark-mode {
            --bg-body: #0f1113;
            --bg-card: #1a1d21;
            --text-main: #f1f1f1;
            --text-muted: #adb5bd;
            --border-color: #2d3238;
            --shadow: 0 10px 30px rgba(0,0,0,0.4);
            --row-hover: #2d1a1a;
        }

        body { 
            background-color: var(--bg-body); 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .header-mef { 
            background-color: var(--primary-color); 
            color: white; 
            padding: 25px 0; 
            border-bottom: 5px solid var(--nav-accent); 
        }

        .table-container { 
            background: var(--bg-card); 
            border-radius: 12px; 
            box-shadow: var(--shadow); 
            padding: 20px; 
            border: 1px solid var(--border-color);
            transition: background-color 0.3s;
        }

        /* Estilos de Tabla */
        .table { color: var(--text-main); border-color: var(--border-color); }
        .table thead { background-color: var(--nav-accent); color: #000; cursor: pointer; }
        
        .table-hover tbody tr:hover td {
            background-color: var(--row-hover) !important;
            transition: background-color 0.2s ease;
        }

        .highlight-lambayeque { 
            background-color: rgba(128, 22, 22, 0.08) !important; 
            border: 2px solid var(--primary-color) !important; 
            font-weight: bold; 
        }
        
        body.dark-mode .highlight-lambayeque { 
            background-color: rgba(128, 22, 22, 0.25) !important; 
        }

        /* Barras de Progreso */
        .progress { 
            height: 22px; 
            border-radius: 11px; 
            background-color: var(--border-color); 
            position: relative; 
            border: 1px solid #ccc; 
            overflow: hidden; 
        }
        .progress-bar-text { 
            position: absolute; 
            width: 100%; 
            text-align: center; 
            font-size: 0.75rem; 
            font-weight: 800; 
            color: #000; 
            z-index: 5; 
            line-height: 20px; 
            text-shadow: 0 0 2px white;
        }
        .bar-fill { height: 100%; z-index: 1; transition: width 0.8s ease-in-out; }

        .monto { 
            font-family: 'SFMono-Regular', Consolas, monospace; 
            font-weight: 600; 
            letter-spacing: -0.3px;
        }

        .alert-custom {
            border-left: 5px solid var(--primary-color) !important;
            background-color: var(--bg-card);
            box-shadow: var(--shadow);
            color: var(--text-muted);
        }

        /* Botones de Tema y Exportación */
        .btn-theme {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        /* Esto obliga a las celdas a usar el color de fondo de la tarjeta */
.table td, .table th {
    background-color: var(--bg-card) !important;
    color: var(--text-main) !important;
    border-color: var(--border-color) !important;
}

/* Para que el efecto hover (pasar el mouse) funcione en modo oscuro */
.table-hover tbody tr:hover td {
    background-color: var(--row-hover) !important;
}

/* Ajuste para que el encabezado no se pierda */
.table thead th {
    background-color: var(--nav-accent) !important;
    color: #000 !important; /* El texto del encabezado siempre negro para contraste */
}

/* Lambayeque resaltado */
.highlight-lambayeque td {
    background-color: rgba(128, 22, 22, 0.1) !important; /* Rojo muy suave */
    font-weight: bold;
}

body.dark-mode .highlight-lambayeque td {
    background-color: rgba(255, 193, 7, 0.1) !important; /* Dorado suave en modo oscuro */
    border-top: 1px solid var(--nav-accent) !important;
    border-bottom: 1px solid var(--nav-accent) !important;
}
        .btn-theme:hover { background: rgba(255, 255, 255, 0.3); color: var(--nav-accent); }

        .btn-export { font-size: 0.85rem; font-weight: 600; transition: all 0.2s; }
        .btn-excel { background-color: #1D6F42; color: white; border: none; }
        .btn-pdf { background-color: #AD0B00; color: white; border: none; }
    </style>
</head>
<body>

<div class="header-mef mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-0">RANKING REGIONAL DE EJECUCIÓN 2026</h4>
            <span class="badge bg-light text-dark border fw-normal mt-1">
                <i class="bi bi-database-check text-primary"></i> MEF: <span id="fecha-actualizacion">...</span>
            </span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <button onclick="toggleDarkMode()" class="btn-theme" id="theme-toggle" title="Cambiar modo">
                <i class="bi bi-moon-stars"></i>
            </button>
            <a href="index.html" class="btn btn-warning fw-bold rounded-pill px-4 shadow-sm">
                <i class="bi bi-arrow-left me-2"></i>Volver
            </a>
        </div>
    </div>
</div>

<div class="container mb-5">
    <div class="row">
        <div class="col-12">
            <div class="alert alert-custom border-0 mb-4">
                <h6 class="fw-bold" style="color: var(--primary-color);">
                    <i class="bi bi-info-circle-fill me-2"></i>NOTA DE DESEMPEÑO:
                </h6>
                <p class="small mb-0" style="text-align: justify;">
                    Este ranking mide exclusivamente la eficiencia del <strong>Pliego: Gobierno Regional de Lambayeque</strong> frente a los otros 24 Gobiernos Regionales al cierre del 2026.
                </p>
            </div>
        </div>
    </div>

    <div class="table-container">
        <div class="d-flex justify-content-end gap-2 mb-3">
            <button onclick="exportToExcel()" class="btn btn-export btn-excel rounded-pill px-3 shadow-sm">
                <i class="bi bi-file-earmark-excel-fill me-1"></i> Excel
            </button>
            <button onclick="exportToPDF()" class="btn btn-export btn-pdf rounded-pill px-3 shadow-sm">
                <i class="bi bi-file-earmark-pdf-fill me-1"></i> PDF
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle" id="tablaMaster">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)" class="text-center">N°</th>
                        <th onclick="sortTable(1)" class="th-sort">PLIEGO</th>
                        <th onclick="sortTable(2)" class="text-center">PIM (S/)</th>
                        <th onclick="sortTable(3)" class="text-center">DEVENGADO (S/)</th>
                        <th onclick="sortTable(4)" class="text-center">AVANCE (%)</th>
                        <th onclick="sortTable(5)" class="text-center">POR DEVENGAR (S/)</th>
                    </tr>
                </thead>
                <tbody id="tabla-ranking"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<script>
    let rawData = [];
    let sortOrder = [true, true, true, true, true, true];
    const body = document.body;
    const btnTheme = document.getElementById('theme-toggle');

    // --- LÓGICA MODO OSCURO ---
    function actualizarIcono(isDark) {
        const icon = btnTheme.querySelector('i');
        icon.className = isDark ? 'bi bi-sun' : 'bi bi-moon-stars';
    }

    function toggleDarkMode() {
        const isDark = body.classList.toggle('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        actualizarIcono(isDark);
    }

    // --- CARGA DE DATOS ---
    async function cargarRanking() {
        try {
            const res = await fetch('data_ranking.json?v=' + Math.random());
            const data = await res.json();
            document.getElementById('fecha-actualizacion').innerText = data.ultima_actualizacion;
            rawData = data.ranking;
            renderTable(rawData);
        } catch (error) {
            console.error("Error:", error);
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('tabla-ranking');
        tbody.innerHTML = '';
        data.forEach((reg, index) => {
            const esLambayeque = reg.pliego.toUpperCase().includes("LAMBAYEQUE");
            const avanceReal = (reg.devengado / reg.pim * 100);
            const avanceVisible = (Math.floor(avanceReal * 10) / 10).toFixed(1);

            let color = avanceReal >= 90 ? "#10b981" : avanceReal > 70 ? "#34d399" : avanceReal > 30 ? "#fbbf24" : "#ef4444";
            let semaforo = avanceReal >= 90 ? "🟢" : avanceReal > 30 ? "🟡" : "🔴";

            tbody.innerHTML += `
                <tr class="${esLambayeque ? 'highlight-lambayeque' : ''}">
                    <td class="text-center">${index + 1}</td>
                    <td class="text-uppercase">${reg.pliego}</td>
                    <td class="text-end monto">${reg.pim.toLocaleString('es-PE')}</td>
                    <td class="text-end monto text-primary">${reg.devengado.toLocaleString('es-PE')}</td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <span>${semaforo}</span>
                            <div class="progress flex-grow-1">
                                <div class="progress-bar-text">${avanceVisible}%</div>
                                <div class="bar-fill" style="width: ${avanceVisible}%; background-color: ${color};"></div>
                            </div>
                        </div>
                    </td>
                    <td class="text-end monto text-danger">${reg.saldo.toLocaleString('es-PE')}</td>
                </tr>`;
        });
    }

    // --- FUNCIONES EXTRA ---
    function sortTable(colIndex) {
        const keys = ['index', 'pliego', 'pim', 'devengado', 'avance', 'saldo'];
        const key = keys[colIndex];
        sortOrder[colIndex] = !sortOrder[colIndex];
        rawData.sort((a, b) => {
            let valA = a[key], valB = b[key];
            return sortOrder[colIndex] ? (valA > valB ? 1 : -1) : (valA < valB ? 1 : -1);
        });
        renderTable(rawData);
    }

    function exportToExcel() {
        XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById("tablaMaster")), "Ranking_2026.xlsx");
    }

    function exportToPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('l', 'mm', 'a4');
        doc.text("RANKING REGIONAL 2026", 14, 15);
        doc.autoTable({ html: '#tablaMaster', startY: 20, theme: 'grid', headStyles: {fillColor: [128, 22, 22]} });
        doc.save("Ranking_2026.pdf");
    }

    // Inicialización al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark-mode');
            actualizarIcono(true);
        }
        cargarRanking();
    });
</script>
</body>
</html>
