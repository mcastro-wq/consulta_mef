<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Nacional - MEF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-mef { background-color: #801616; color: white; padding: 15px 0; margin-bottom: 20px; }
        .table-ranking { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table thead { background-color: #801616; color: white; }
        .table-sm td, .table-sm th { padding: 8px; font-size: 0.85rem; }
        .progress { height: 18px; background-color: #e9ecef; border-radius: 10px; position: relative; }
        .progress-text { position: absolute; width: 100%; text-align: center; font-size: 0.7rem; font-weight: bold; color: #000; line-height: 18px; }
        .highlight-lambayeque { background-color: #fff3f3 !important; font-weight: bold; border: 2px solid #801616 !important; }
        .btn-mef { background-color: white; color: #801616; border: none; font-weight: bold; padding: 5px 15px; border-radius: 20px; text-decoration: none; }
        .btn-mef:hover { background-color: #f0f0f0; }
    </style>
</head>
<body>

<div class="header-mef">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h4 class="mb-0">Ranking de Ejecución Presupuestal 2025</h4>
            <small>Actualizado: <span id="fecha-actualizacion">...</span></small>
        </div>
        <a href="index.html" class="btn-mef">← Detalle Lambayeque</a>
    </div>
</div>

<div class="container">
    <div class="table-ranking p-3">
        <div class="table-responsive">
            <table class="table table-sm table-bordered table-hover align-middle">
                <thead>
                    <tr class="text-center">
                        <th>N°</th>
                        <th>PLIEGO (REGIÓN)</th>
                        <th>PIM</th>
                        <th>CERTIFICADO</th>
                        <th>DEVENGADO</th>
                        <th style="width: 200px;">AVANCE %</th>
                        <th>POR DEVENGAR (SALDO)</th>
                    </tr>
                </thead>
                <tbody id="tabla-ranking">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function cargarRanking() {
        try {
            const res = await fetch('data_ranking.json?v=' + Math.random());
            const data = await res.json();
            document.getElementById('fecha-actualizacion').innerText = data.ultima_actualizacion;

            const tbody = document.getElementById('tabla-ranking');
            tbody.innerHTML = '';

            data.ranking.forEach((reg, index) => {
                const esLambayeque = reg.pliego.includes("LAMBAYEQUE");
                let colorBarra = "#dc3545"; // Rojo
                let semaforo = "🔴";

                if (reg.avance > 30) { colorBarra = "#ffc107"; semaforo = "🟡"; }
                if (reg.avance > 70) { colorBarra = "#198754"; semaforo = "🟢"; }

                const row = `
                    <tr class="${esLambayeque ? 'highlight-lambayeque' : ''}">
                        <td class="text-center fw-bold">${index + 1}</td>
                        <td>${reg.pliego}</td>
                        <td class="text-end">S/ ${reg.pim.toLocaleString('es-PE')}</td>
                        <td class="text-end">S/ ${reg.certificado.toLocaleString('es-PE')}</td>
                        <td class="text-end fw-bold text-primary">S/ ${reg.devengado.toLocaleString('es-PE')}</td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <span>${semaforo}</span>
                                <div class="progress flex-grow-1">
                                    <div class="progress-bar" style="width: ${reg.avance}%; background-color: ${colorBarra};"></div>
                                    <span class="progress-text">${reg.avance}%</span>
                                </div>
                            </div>
                        </td>
                        <td class="text-end text-danger fw-bold">S/ ${reg.saldo.toLocaleString('es-PE')}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        } catch (e) {
            console.error(e);
        }
    }
    document.addEventListener('DOMContentLoaded', cargarRanking);
</script>

</body>
</html>
