<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial GORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --gore: #7a3321; }
        body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; font-size: 0.85rem; }
        .main-card { background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); padding: 25px; margin-top: 20px; }
        .table thead th { background: #f2f2f2; color: var(--gore); cursor: pointer; text-transform: uppercase; font-size: 0.7rem; }
        .badge-cui { background: #6c757d; color: white; padding: 5px 10px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container-fluid px-4">
    <div class="main-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold m-0" style="color: var(--gore)"><i class="bi bi-clock-history"></i> Historial de Gestión</h4>
            <div class="d-flex gap-2">
                <button onclick="exportarExcel()" class="btn btn-success btn-sm"><i class="bi bi-file-earmark-excel"></i> Exportar Excel</button>
                <a href="index.html" class="btn btn-outline-secondary btn-sm">Volver</a>
            </div>
        </div>

        <div class="mb-3">
            <input type="text" id="buscador" class="form-control" placeholder="Buscar por CUI, Estado o Palabra Clave..." onkeyup="filtrar()">
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-bordered align-middle">
                <thead>
                    <tr>
                        <th onclick="ordenar(0)">Fecha Registro <i class="bi bi-arrow-down-up"></i></th>
                        <th onclick="ordenar(1)">CUI <i class="bi bi-arrow-down-up"></i></th>
                        <th>Estado Gral.</th>
                        <th>Detalle</th>
                        <th>Estado Específico</th>
                        <th>Timeline Inversión</th>
                        <th>Acciones</th>
                        <th>SISGEDO</th>
                    </tr>
                </thead>
                <tbody id="tablaBody">
                    <tr><td colspan="8" class="text-center py-5">Cargando datos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let rawData = [];
    const API_URL = 'https://script.google.com/macros/s/AKfycbwDEGA0bOYDv3opzS0qteRFUS_ik9SzT5XlKCpjU6_PWzfPtBjBLfI52Zog8Cojtgz1/exec';

    async function cargar() {
        try {
            const resp = await fetch(API_URL + "?modo=todo");
            const res = await resp.json();
            if (res.status === "success") {
                rawData = res.data;
                renderizar(rawData);
            }
        } catch (e) {
            document.getElementById('tablaBody').innerHTML = '<tr><td colspan="8" class="text-center text-danger">Error de conexión</td></tr>';
        }
    }

    function renderizar(datos) {
        const body = document.getElementById('tablaBody');
        body.innerHTML = datos.map(item => `
            <tr>
                <td class="fw-bold text-secondary text-nowrap">${item.fecha_registro}</td>
                <td class="text-center"><span class="badge-cui">${item.codigo_cui || ''}</span></td>
                <td class="fw-bold text-danger text-uppercase">${item.estado_general || ''}</td>
                <td><small>${item.detalle_estado_general || ''}</small></td>
                <td>
                    <div class="fw-bold text-primary">${item.estado_especifico || ''}</div>
                    <div class="text-muted small">${item.detalle_estado_especifico || ''}</div>
                </td>
                <td class="fw-bold text-info">${item.timeline_inversion || '-'}</td>
                <td><small>${item.acciones_programadas || ''}</small></td>
                <td class="fw-bold text-center">${item.sisgedo || '-'}</td>
            </tr>
        `).join('');
    }

    function filtrar() {
        const q = document.getElementById('buscador').value.toLowerCase();
        const filtrados = rawData.filter(i => Object.values(i).some(v => String(v).toLowerCase().includes(q)));
        renderizar(filtrados);
    }

    function exportarExcel() {
        const ws = XLSX.utils.json_to_sheet(rawData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Historial");
        XLSX.writeFile(wb, "Reporte_Gestion_GORE.xlsx");
    }

    let asc = true;
    function ordenar(col) {
        const claves = ['fecha_registro', 'codigo_cui'];
        asc = !asc;
        rawData.sort((a,b) => (a[claves[col]] > b[claves[col]]) ? (asc?1:-1) : (asc?-1:1));
        renderizar(rawData);
    }

    window.onload = cargar;
</script>
</body>
</html>
