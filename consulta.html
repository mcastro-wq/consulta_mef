<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Gestión - GORE</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { --gore-brown: #703020; }
        body { background-color: #f4f6f9; font-family: 'Inter', system-ui, sans-serif; }
        
        .main-container { background: white; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); padding: 25px; margin-top: 20px; }
        
        /* Tabla Estilizada */
        .table { border-collapse: separate; border-spacing: 0; border: 1px solid #eef0f3; }
        .table thead th { 
            background-color: #f8f9fa; 
            color: #495057; 
            font-weight: 600; 
            text-transform: uppercase; 
            font-size: 0.75rem; 
            letter-spacing: 0.5px;
            padding: 12px;
            cursor: pointer;
            border-bottom: 2px solid #dee2e6;
        }
        .table thead th:hover { background-color: #eceef1; }
        .table tbody td { padding: 12px; vertical-align: middle; font-size: 0.85rem; border-bottom: 1px solid #f1f1f1; }
        
        /* Buscador y Botones */
        .search-bar { max-width: 400px; border-radius: 20px; padding-left: 40px; }
        .search-icon { position: absolute; left: 25px; top: 50%; transform: translateY(-50%); color: #adb5bd; }
        .btn-excel { background-color: #1d6f42; color: white; border: none; }
        .btn-excel:hover { background-color: #155a35; color: white; }
    </style>
</head>
<body>

<div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center py-3">
        <h4 class="fw-bold m-0" style="color: var(--gore-brown)">
            <i class="bi bi-journal-text me-2"></i>Historial de Gestión
        </h4>
        <div class="d-flex gap-2">
            <button class="btn btn-excel btn-sm px-3" onclick="exportarExcel()">
                <i class="bi bi-file-earmark-excel me-1"></i> Exportar Excel
            </button>
            <a href="index.html" class="btn btn-outline-secondary btn-sm px-3">Volver</a>
        </div>
    </div>

    <div class="main-container">
        <div class="row mb-4">
            <div class="col-md-6 position-relative">
                <i class="bi bi-search search-icon"></i>
                <input type="text" id="globalSearch" class="form-control search-bar" 
                       placeholder="Buscar por CUI o palabra clave..." onkeyup="filtrarYRenderizar()">
            </div>
        </div>

        <div class="table-responsive">
            <table class="table" id="tablaPrincipal">
                <thead>
                    <tr>
                        <th onclick="ordenar(0)">Fecha <i class="bi bi-arrow-down-up ms-1"></i></th>
                        <th onclick="ordenar(1)">CUI <i class="bi bi-arrow-down-up ms-1"></i></th>
                        <th onclick="ordenar(2)">Estado General</th>
                        <th onclick="ordenar(3)">Detalle</th>
                        <th onclick="ordenar(4)">Estado Específico</th>
                        <th onclick="ordenar(5)">SISGEDO</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="6" class="text-center py-5">
                            <div class="spinner-border text-secondary spinner-border-sm" role="status"></div>
                            <span class="ms-2">Cargando registros...</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let rawData = [];
    const urlApi = 'https://script.google.com/macros/s/AKfycbzJ8wJlhZ9w-aAtl_1bsZPyy9OhnFp_cB4Sa_Ovt-hijyN8MS-dloEU8cChQIxTD2bG/exec';

    async function cargarDatos() {
        try {
            const response = await fetch(`${urlApi}?modo=todo`);
            const res = await response.json();
            if (res.status === "success") {
                rawData = res.data;
                filtrarYRenderizar();
            }
        } catch (e) {
            document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" class="text-center text-danger">Error al cargar datos</td></tr>`;
        }
    }

    function filtrarYRenderizar() {
        const query = document.getElementById('globalSearch').value.toLowerCase();
        const filtered = rawData.filter(item => {
            return Object.values(item).some(val => String(val).toLowerCase().includes(query));
        });

        const html = filtered.map(item => `
            <tr>
                <td class="text-nowrap fw-bold text-muted">${formatearFecha(item.fecha_registro)}</td>
                <td><span class="badge bg-light text-dark border">${item.codigo_cui || ''}</span></td>
                <td class="fw-bold" style="color: var(--gore-brown)">${item.estado_general || ''}</td>
                <td class="text-muted small">${item.detalle_estado_general || ''}</td>
                <td>
                    <div class="fw-bold text-primary">${item.estado_especifico || ''}</div>
                    <div class="text-muted" style="font-size: 0.75rem;">${item.detalle_estado_especifico || ''}</div>
                </td>
                <td class="fw-bold">${item.sisgedo || '-'}</td>
            </tr>
        `).join('');

        document.getElementById('tableBody').innerHTML = html || '<tr><td colspan="6" class="text-center">No hay resultados</td></tr>';
    }

    function formatearFecha(fechaStr) {
        if (!fechaStr) return '---';
        const d = new Date(fechaStr);
        if (isNaN(d.getTime())) return fechaStr; // Retorna original si falla
        return d.toLocaleDateString('es-PE') + ' ' + d.toLocaleTimeString('es-PE', {hour: '2-digit', minute:'2-digit'});
    }

    // Lógica de Ordenamiento
    let sortAsc = true;
    function ordenar(colIndex) {
        sortAsc = !sortAsc;
        rawData.sort((a, b) => {
            const keys = ['fecha_registro', 'codigo_cui', 'estado_general', 'detalle_estado_general', 'estado_especifico', 'sisgedo'];
            let valA = a[keys[colIndex]] || '';
            let valB = b[keys[colIndex]] || '';
            return sortAsc ? (valA > valB ? 1 : -1) : (valA < valB ? 1 : -1);
        });
        filtrarYRenderizar();
    }

    // Exportar a Excel
    function exportarExcel() {
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.json_to_sheet(rawData);
        XLSX.utils.book_append_sheet(wb, ws, "Historial");
        XLSX.writeFile(wb, "Historial_Gestion_GORE.xlsx");
    }

    window.onload = cargarDatos;
</script>

</body>
</html>
